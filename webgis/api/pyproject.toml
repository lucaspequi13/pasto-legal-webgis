[project]
name = "webgis-api"
version = "0.1.0"
description = "API do WebGIS do Pasto Legal (#171): links, rascunhos e regras de desenho"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pgserver>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
