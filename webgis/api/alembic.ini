# Migrações do banco do WebGIS (schema "webgis"). A URL vem de WEBGIS_DATABASE_URL.
#   uv run alembic upgrade head            # aplica
#   uv run alembic revision -m "descrição"  # nova migração (SQL à mão em migrations/versions)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
